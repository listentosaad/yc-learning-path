<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #141414;
    --surface-hover: #1a1a1a;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --text-primary: #f0ede8;
    --text-secondary: #7a7672;
    --text-muted: #3d3b38;
    --accent: oklch(0.68 0.18 45);
    --accent-dim: oklch(0.68 0.18 45 / 0.15);
    --accent-glow: oklch(0.68 0.18 45 / 0.08);
    --done-text: #3a3835;
    --radius: 14px;
    --font: 'ThmanyahSans', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    /* Subtle grain */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  }

  /* Navbar */
  .navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 24px;
    z-index: 90;
    pointer-events: none;
  }
  .navbar-logo {
    height: 28px;
    width: auto;
    opacity: 0.85;
    pointer-events: all;
    transition: opacity 0.2s;
  }
  .navbar-logo:hover { opacity: 1; }

  /* Progress bar */
  #progress-rail {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,0.05);
    z-index: 100;
  }
  #progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 12px var(--accent);
  }

  /* Layout */
  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* Hero */
  .hero {
    padding: 120px 0 64px;
    text-align: center;
  }
  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 28px;
    padding: 6px 14px;
    border: 1px solid var(--accent-dim);
    border-radius: 100px;
    background: var(--accent-glow);
  }
  .hero h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: 0;
    color: var(--text-primary);
    max-width: 480px;
    margin: 0 auto 16px;
    text-wrap: pretty;
    font-family: 'ThmanyahSerif', serif;
    font-feature-settings: "calt" 1, "liga" 1, "cswh" 1;
  }
  .hero h2 {
    font-size: clamp(15px, 2vw, 18px);
    font-weight: 500;
    color: var(--text-secondary);
    line-height: 1.7;
    max-width: 420px;
    margin: 0 auto 36px;
    font-family: 'ThmanyahSerif', serif;
    font-feature-settings: "calt" 1, "liga" 1;
  }

  /* Stats strip */
  .stats-strip {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 16px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .stat-num {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  /* Privacy micro-copy */
  .privacy-note {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 24px;
  }
  .privacy-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }

  /* Modules */
  .modules { display: flex; flex-direction: column; gap: 16px; }

  /* Module card */
  .module-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
    opacity: 0;
    transform: translateY(20px);
    animation: cardIn 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .module-card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 4px 32px rgba(0,0,0,0.4);
  }
  .module-card.all-done {
    border-color: oklch(0.68 0.18 45 / 0.25);
    box-shadow: 0 0 0 1px oklch(0.68 0.18 45 / 0.12);
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Module header */
  .module-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 22px 18px;
    cursor: pointer;
    user-select: none;
    gap: 12px;
    width: 100%;
    background: none;
    border: none;
    font-family: var(--font);
    text-align: right;
    color: inherit;
  }
  .module-header:hover .module-title { color: var(--text-primary); }
  .module-header:hover .chevron { opacity: 1; color: var(--accent); }
  .module-header:not(.is-open):hover { background: rgba(255,255,255,0.02); }
  .module-header:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    border-radius: var(--radius) var(--radius) 0 0;
  }

  .module-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
    min-width: 0;
  }
  .module-num {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    width: 26px;
    height: 26px;
    border: 1px solid var(--accent-dim);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-glow);
    flex-shrink: 0;
    letter-spacing: 0;
  }
  .module-text { flex: 1; min-width: 0; }
  .module-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    transition: color 0.2s;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .module-subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  .module-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .module-progress-ring {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
  }
  .module-progress-ring circle {
    transition: stroke-dashoffset 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .chevron {
    color: var(--text-secondary);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), color 0.2s;
    flex-shrink: 0;
    opacity: 0.6;
  }
  .chevron.open { transform: rotate(180deg); opacity: 1; color: var(--accent); }

  /* Module body */
  .module-body {
    overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1);
  }
  .module-body-inner {
    padding: 0 22px 20px;
    border-top: 1px solid var(--border);
  }

  /* Section label */
  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin: 16px 0 8px;
  }
  .section-label::before {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
    order: 1;
  }

  /* Item row */
  .item-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    border-radius: 8px;
    margin: 0 -8px;
    width: calc(100% + 16px);
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: var(--font);
    text-align: right;
    color: inherit;
  }
  .item-row:last-child { border-bottom: none; }
  .item-row:hover { background: var(--surface-hover); }
  .item-row:hover .item-check { border-color: var(--accent); }
  .item-row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: var(--surface-hover);
  }

  .item-check {
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--border-hover);
    border-radius: 5px;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
    background: transparent;
    cursor: pointer;
    padding: 0;
    font-family: var(--font);
  }
  a.item-label {
    text-decoration: none;
    cursor: pointer;
    display: block;
  }
  a.item-label:not(.done):hover {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: oklch(0.68 0.18 45 / 0.4);
    text-underline-offset: 3px;
  }
  .item-check.checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .check-svg {
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  .check-svg.visible {
    opacity: 1;
    transform: scale(1);
  }

  .item-content { flex: 1; min-width: 0; }
  .item-label {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.5;
    transition: color 0.3s, text-decoration 0.3s;
  }
  .item-label.done {
    color: var(--done-text);
    text-decoration: line-through;
    text-decoration-color: var(--text-muted);
  }
  .item-meta {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 1px;
    font-weight: 300;
  }
  .item-type {
    font-size: 13px;
    flex-shrink: 0;
    margin-top: 1px;
    opacity: 0.7;
  }

  /* Item count hint on closed cards */
  .item-count-hint {
    font-size: 10px;
    color: var(--text-muted);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 100px;
    font-variant-numeric: tabular-nums;
    transition: color 0.2s, border-color 0.2s;
  }
  .module-header:hover .item-count-hint {
    color: var(--text-secondary);
    border-color: var(--border-hover);
  }

  /* Done badge on module */
  .done-badge {
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-glow);
    border: 1px solid var(--accent-dim);
    padding: 3px 8px;
    border-radius: 100px;
    letter-spacing: 0.05em;
  }

  /* Reset button */
  .reset-btn {
    display: block;
    margin: 40px auto 0;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--font);
    font-size: 12px;
    padding: 8px 20px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .reset-btn:hover {
    border-color: var(--border-hover);
    color: var(--text-secondary);
    background: var(--surface);
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 48px 24px 32px;
    border-top: 1px solid var(--border);
    margin-top: 64px;
  }
  .footer-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.7;
    max-width: 400px;
    margin: 0 auto 24px;
  }
  .footer-credit {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
    font-weight: 300;
  }

  /* Completion banner */
  .completion-banner {
    background: var(--accent-glow);
    border: 1px solid var(--accent-dim);
    border-radius: var(--radius);
    padding: 20px 24px;
    text-align: center;
    margin-bottom: 32px;
    animation: cardIn 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .completion-banner h3 {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .completion-banner p {
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* Social links */
  .social-links {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 10px;
  }
  .social-link {
    color: var(--text-muted);
    transition: color 0.2s;
    display: flex;
    align-items: center;
    text-decoration: none;
  }
  .social-link:hover { color: var(--text-secondary); }
  .social-link svg { display: block; }

  @media (max-width: 600px) {
    .container { padding: 0 16px 60px; }
    .hero { padding: 72px 0 48px; }
    .stats-strip { gap: 20px; }
    .module-title { font-size: 14px; }
    .tweaks-panel { left: 12px; bottom: 12px; width: calc(100% - 24px); }
  }
</style>

  { id: "m6v2", label: "نماذج العمل والتسعير", url: "https://youtu.be/oWZbWzAyHAE" },
  { id: "m6v3", label: "استراتيجيات النمو", url: "https://youtu.be/6lY9CYIY4pQ" }],

  readings: []
}];



const STORAGE_KEY = "yc_study_plan_v1";
const TWEAKS_KEY = "yc_study_tweaks_v1";

function loadChecked() {
  try {return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};}
  catch {return {};}
}
function saveChecked(data) {
  try {localStorage.setItem(STORAGE_KEY, JSON.stringify(data));} catch {}
}

// Count total items
const ALL_ITEMS = MODULES.flatMap((m) => [...m.videos, ...m.readings]);
const TOTAL = ALL_ITEMS.length;

function RingProgress({ done, total, size = 32 }) {
  const r = (size - 5) / 2;
  const circ = 2 * Math.PI * r;
  const pct = total === 0 ? 0 : done / total;
  const offset = circ * (1 - pct);
  return (
    <svg className="module-progress-ring" width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="2.5" />
      <circle
        cx={size / 2} cy={size / 2} r={r}
        fill="none"
        stroke={done === total && total > 0 ? "var(--accent)" : "var(--accent)"}
        strokeWidth="2.5"
        strokeDasharray={circ}
        strokeDashoffset={offset}
        strokeLinecap="round"
        transform={`rotate(-90 ${size / 2} ${size / 2})`}
        opacity={pct === 0 ? 0 : 1} />
      
      {done === total && total > 0 &&
      <text x={size / 2} y={size / 2 + 4} textAnchor="middle" fontSize="10" fill="var(--accent)" fontFamily="Tajawal" fontWeight="700">✓</text>
      }
    </svg>);

}

function ModuleCard({ mod, checked, onToggle, idx, showMeta }) {
  const items = [...mod.videos, ...mod.readings];
  const doneCount = items.filter((i) => checked[i.id]).length;
  const allDone = doneCount === items.length;
  const [open, setOpen] = useState(idx === 0);

  return (
    <div
      className={`module-card${allDone ? " all-done" : ""}`}
      style={{ animationDelay: `${idx * 60}ms` }}>
      
      <button
        className={`module-header${open ? " is-open" : ""}`}
        onClick={() => setOpen((o) => !o)}
        aria-expanded={open}
        aria-controls={`module-body-${mod.id}`}>
        
        <div className="module-left">
          <span className="module-num">{mod.num}</span>
          <div className="module-text">
            <div className="module-title">{mod.title}</div>
            <div className="module-subtitle">{mod.subtitle}</div>
          </div>
        </div>
        <div className="module-right">
          {allDone ?
          <RingProgress done={doneCount} total={items.length} /> :
          <>
                {!open && <span className="item-count-hint">{items.length} عنصر</span>}
                <RingProgress done={doneCount} total={items.length} />
              </>
          }
          <svg className={`chevron${open ? " open" : ""}`} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </div>
      </button>

      <div id={`module-body-${mod.id}`} className="module-body" style={{ maxHeight: open ? "2000px" : "0" }}>
        <div className="module-body-inner">
          {mod.videos.length > 0 &&
          <>
              <div className="section-label">فيديوهات</div>
              {mod.videos.map((item) =>
            <ItemRow key={item.id} item={item} checked={!!checked[item.id]} onToggle={onToggle} type="video" showMeta={showMeta} />
            )}
            </>
          }
          {mod.readings.length > 0 &&
          <>
              <div className="section-label">قراءات</div>
              {mod.readings.map((item) =>
            <ItemRow key={item.id} item={item} checked={!!checked[item.id]} onToggle={onToggle} type="reading" showMeta={showMeta} />
            )}
            </>
          }
        </div>
      </div>
    </div>);

}

function ItemRow({ item, checked, onToggle, type }) {
  const handleCheck = (e) => {
    e.preventDefault();
    e.stopPropagation();
    onToggle(item.id);
  };
  return (
    <div className="item-row">
      <button
        className={`item-check${checked ? " checked" : ""}`}
        onClick={handleCheck}
        onKeyDown={(e) => (e.key === 'Enter' || e.key === ' ') && handleCheck(e)}
        role="checkbox"
        aria-checked={checked}
        aria-label={`تحديد: ${item.label}`}>
        
        <svg className={`check-svg${checked ? " visible" : ""}`} width="10" height="10" viewBox="0 0 12 12" fill="none">
          <polyline points="2,6 5,9 10,3" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </button>
      <div className="item-content">
        <a
          className={`item-label${checked ? " done" : ""}`}
          href={item.url}
          target="_blank"
          rel="noopener noreferrer"
          onClick={(e) => e.stopPropagation()}>
          {item.label}</a>
      </div>
      <div className="item-type">{type === "video" ? "📺" : "📖"}</div>
    </div>);

}

function App() {
  const [checked, setChecked] = useState(loadChecked);
  const [tweaks, setTweaks] = useState(() => {
    try {return { ...TWEAK_DEFAULTS, ...JSON.parse(localStorage.getItem(TWEAKS_KEY)) };}
    catch {return TWEAK_DEFAULTS;}
  });
  const [showTweaks, setShowTweaks] = useState(false);

  const totalDone = Object.values(checked).filter(Boolean).length;
  const pct = TOTAL === 0 ? 0 : totalDone / TOTAL * 100;
  const allComplete = totalDone === TOTAL;

  // Apply accent color
  useEffect(() => {
    const color = ACCENT_COLORS[tweaks.accentColor] || ACCENT_COLORS.orange;
    document.documentElement.style.setProperty("--accent", color);
    document.documentElement.style.setProperty("--accent-dim", color.replace(")", " / 0.15)").replace("oklch(", "oklch("));
    document.documentElement.style.setProperty("--accent-glow", color.replace(")", " / 0.08)").replace("oklch(", "oklch("));
  }, [tweaks.accentColor]);

  // Save tweaks
  useEffect(() => {
    try {localStorage.setItem(TWEAKS_KEY, JSON.stringify(tweaks));} catch {}
  }, [tweaks]);

  // Update progress bar
  useEffect(() => {
    const fill = document.getElementById("progress-fill");
    if (fill) fill.style.width = pct + "%";
  }, [pct]);

  const onToggle = useCallback((id) => {
    setChecked((prev) => {
      const next = { ...prev, [id]: !prev[id] };
      saveChecked(next);
      return next;
    });
  }, []);

  const onReset = () => {
    if (window.confirm("هل تريد إعادة ضبط كل التقدم؟")) {
      setChecked({});
      saveChecked({});
    }
  };

  const updateTweak = (k, v) => {
    setTweaks((t) => ({ ...t, [k]: v }));
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*");
  };

  // Register Tweaks panel with host
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === "__activate_edit_mode") setShowTweaks(true);
      if (e.data?.type === "__deactivate_edit_mode") setShowTweaks(false);
    };
    window.addEventListener("message", handler);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", handler);
  }, []);

  const cardGap = tweaks.cardSpacing === "compact" ? "8px" : "16px";

  return (
    <>
      {/* Hero */}
      <div className="container">
        <div className="hero">
          <div className="hero-eyebrow">
            <svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="currentColor" /></svg>
            Startup School · YC
          </div>
          <h1>خطة دراسة<br />ريادة الأعمال</h1>
          <h2>مسار منظّم لإتقان أساسيات بناء الشركات الناشئة من خلال محتوى Y Combinator ، بها تصنع شركة ناشئة ناجحة</h2>

          <div className="stats-strip">
            <div className="stat">
              <span className="stat-num" style={{ color: "var(--accent)" }}>{totalDone}</span>
              <span className="stat-label">مكتمل</span>
            </div>
            <div className="stat">
              <span className="stat-num">{TOTAL - totalDone}</span>
              <span className="stat-label">متبقٍّ</span>
            </div>
            <div className="stat">
              <span className="stat-num">{TOTAL}</span>
              <span className="stat-label">إجمالي</span>
            </div>
          </div>

          <div className="privacy-note">
            <span className="privacy-dot" />
            {"\n\nتقدمك محفوظ تلقائياً في متصفحك"}
          </div>
        </div>

        {/* Completion banner */}
        {allComplete &&
        <div className="completion-banner">
            <h3>🎉 أتممت المسار كاملاً!</h3>
            <p>لقد أكملت جميع الفيديوهات والقراءات — أنت جاهز للبناء.</p>
          </div>
        }

        {/* Modules */}
        <div className="modules" style={{ gap: cardGap }}>
          {MODULES.map((mod, i) =>
          <ModuleCard
            key={mod.id}
            mod={mod}
            checked={checked}
            onToggle={onToggle}
            idx={i} />


          )}
        </div>

        {totalDone > 0 &&
        <button className="reset-btn" onClick={onReset}>إعادة الضبط</button>
        }
      </div>

      {/* Footer */}
      <footer>
        <p className="footer-desc">مسار دراسي منظّم يجمع أفضل محتوى Y Combinator لمساعدتك على بناء شركتك الناشئة بخطوات واضحة.

        </p>
        <p className="footer-credit">الموقع لـ سعد الرفاعي - المؤسس المشارك ومدير المنتجات، نقوة</p>
        <div className="social-links">
          <a className="social-link" href="#" aria-label="تويتر">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.253 5.622 5.911-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z" /></svg>
          </a>
          <a className="social-link" href="#" aria-label="انستقرام">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5" /><circle cx="12" cy="12" r="4" /><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none" /></svg>
          </a>
          <a className="social-link" href="#" aria-label="لينكدإن">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" /><rect x="2" y="9" width="4" height="12" /><circle cx="4" cy="4" r="2" /></svg>
          </a>
          <a className="social-link" href="#" aria-label="غيتهب">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z" /></svg>
          </a>
        </div>
      </footer>


    </>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
